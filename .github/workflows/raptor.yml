# RAPTOR — AI offensive/defensive security research framework devcontainer.
# Upstream: https://github.com/gadievron/raptor (built from upstream's devcontainer Dockerfile)
#
# RAPTOR is commit-tracked rather than release-tracked. The upstream HEAD is
# resolved to an immutable SHA first so that both architectures build the exact
# same source, and so the published tag records what was built.
---
name: raptor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/raptor.yml
      - .github/workflows/_build-image.yml
      - scripts/patch_raptor_dockerfile.py
  pull_request:
    paths:
      - .github/workflows/raptor.yml
      - .github/workflows/_build-image.yml
      - scripts/patch_raptor_dockerfile.py
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

concurrency:
  group: raptor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve upstream commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      sha_short: ${{ steps.head.outputs.sha_short }}
    steps:
      - name: Resolve gadievron/raptor@main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api repos/gadievron/raptor/commits/main --jq '.sha')"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "Building gadievron/raptor@${sha}" >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Image
    needs: resolve
    uses: ./.github/workflows/_build-image.yml
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      image: raptor
      version: sha-${{ needs.resolve.outputs.sha_short }}
      context: upstream/raptor
      dockerfile: upstream/raptor/.devcontainer/Dockerfile
      upstream-repo: gadievron/raptor
      upstream-ref: ${{ needs.resolve.outputs.sha }}
      upstream-submodules: true
      description: RAPTOR security research framework devcontainer
      # Upstream ships a verbatim MIT LICENSE. GitHub's API reports NOASSERTION
      # for it, which is a detector artefact, not a missing licence.
      licenses: MIT
      # The bundled CodeQL CLI is amd64-only; see scripts/patch_raptor_dockerfile.py.
      platforms: linux/amd64,linux/arm64/v8
      prepare-command: python3 scripts/patch_raptor_dockerfile.py "$DOCKERFILE"
      build-timeout-minutes: 150
      push: ${{ github.event_name != 'pull_request' }}
      smoke-command: >-
        docker run --rm --entrypoint bash "$IMAGE"
        -c 'python3 --version && node --version && test -x /usr/local/bin/codeql'
