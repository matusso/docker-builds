# masscan — mass IP port scanner.
# Upstream: https://github.com/robertdavidgraham/masscan
#
# Upstream releases rarely, so the weekly rebuild is about the base image rather
# than about new versions of masscan: it republishes `1.3.2` on top of whatever
# Alpine security updates have landed since the last build.
---
name: masscan

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/masscan.yml
      - .github/workflows/_build-image.yml
      - files/masscan/**
  pull_request:
    paths:
      - .github/workflows/masscan.yml
      - .github/workflows/_build-image.yml
      - files/masscan/**
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

concurrency:
  group: masscan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image
    uses: ./.github/workflows/_build-image.yml
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      image: masscan
      version: 1.3.2
      context: files/masscan
      description: Mass IP port scanner
      licenses: AGPL-3.0-only
      push: ${{ github.event_name != 'pull_request' }}
      # Every masscan help path exits 1, so `--echo` — print the resolved
      # configuration and exit 0 — stands in for one. Under -v it also names the
      # libpcap it dlopened, which is the part of this image most likely to break
      # on a base image bump. Upstream's regression suite runs during the build.
      smoke-command: >-
        out="$(docker run --rm "$IMAGE" -v --echo 2>&1)"; code=$?; printf '%s\n' "$out";
        test "$code" -eq 0 && printf '%s\n' "$out" | grep -q 'pcap: found library'
