# ghauri — advanced SQL injection detection and exploitation tool.
# Upstream: https://github.com/r0oth3x49/ghauri
---
name: ghauri

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ghauri.yml
      - .github/workflows/_build-image.yml
      - files/ghauri/**
  pull_request:
    paths:
      - .github/workflows/ghauri.yml
      - .github/workflows/_build-image.yml
      - files/ghauri/**
  workflow_dispatch:

concurrency:
  group: ghauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image
    uses: ./.github/workflows/_build-image.yml
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      image: ghauri
      version: "1.4.3"
      context: files/ghauri
      description: Advanced SQL injection detection and exploitation tool
      licenses: MIT
      push: ${{ github.event_name != 'pull_request' }}
      smoke-command: docker run --rm "$IMAGE" --help | grep -qi 'usage'

  sonar:
    name: Quality
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/_sonar-scan.yml
    permissions:
      contents: read
    with:
      project-key: docker-builds:ghauri
      project-name: ghauri
      upstream-repo: r0oth3x49/ghauri
      upstream-ref: "1.4.3"
      python-version: "3.14"
    secrets: inherit
