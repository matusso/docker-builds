# RouterSploit — exploitation framework for embedded devices.
# Upstream: https://github.com/threat9/routersploit
---
name: routersploit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/routersploit.yml
      - .github/workflows/_build-image.yml
      - files/routersploit/**
  pull_request:
    paths:
      - .github/workflows/routersploit.yml
      - .github/workflows/_build-image.yml
      - files/routersploit/**
  workflow_dispatch:

concurrency:
  group: routersploit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image
    uses: ./.github/workflows/_build-image.yml
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      image: routersploit
      version: v3.4.7
      context: files/routersploit
      description: Exploitation framework for embedded devices
      licenses: BSD-3-Clause
      push: ${{ github.event_name != 'pull_request' }}
      # rsf.py is an interactive console, so the smoke test asserts the package
      # imports instead — including the telnetlib shim that Python 3.13 removed.
      smoke-command: >-
        docker run --rm --entrypoint python "$IMAGE"
        -c 'import routersploit, telnetlib; print(routersploit.__file__)'

  sonar:
    name: Quality
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/_sonar-scan.yml
    permissions:
      contents: read
    with:
      project-key: docker-builds:routersploit
      project-name: routersploit
      upstream-repo: threat9/routersploit
      upstream-ref: v3.4.7
      python-version: "3.14"
    secrets: inherit
