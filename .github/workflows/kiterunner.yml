# kiterunner (kr) — contextual content discovery and API route enumeration.
# Upstream: https://github.com/assetnote/kiterunner
---
name: kiterunner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kiterunner.yml
      - .github/workflows/_build-image.yml
      - files/kiterunner/**
  pull_request:
    paths:
      - .github/workflows/kiterunner.yml
      - .github/workflows/_build-image.yml
      - files/kiterunner/**
  workflow_dispatch:

concurrency:
  group: kiterunner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image
    uses: ./.github/workflows/_build-image.yml
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      image: kiterunner
      version: v1.0.2
      context: files/kiterunner
      description: Contextual content discovery and API route enumeration tool
      licenses: AGPL-3.0-only
      push: ${{ github.event_name != 'pull_request' }}
      smoke-command: docker run --rm "$IMAGE" version | grep -q 'v1.0.2'

  sonar:
    name: Quality
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/_sonar-scan.yml
    permissions:
      contents: read
    with:
      project-key: docker-builds:kiterunner
      project-name: kiterunner
      upstream-repo: assetnote/kiterunner
      upstream-ref: v1.0.2
    secrets: inherit
