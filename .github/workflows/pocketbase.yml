# PocketBase — open source realtime backend in a single file.
# Upstream: https://github.com/pocketbase/pocketbase
---
name: pocketbase

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pocketbase.yml
      - .github/workflows/_build-image.yml
      - files/pocketbase/**
  pull_request:
    paths:
      - .github/workflows/pocketbase.yml
      - .github/workflows/_build-image.yml
      - files/pocketbase/**
  workflow_dispatch:

concurrency:
  group: pocketbase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image
    uses: ./.github/workflows/_build-image.yml
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      image: pocketbase
      version: v0.39.10
      context: files/pocketbase
      description: Open source realtime backend in a single file
      licenses: MIT
      push: ${{ github.event_name != 'pull_request' }}
      smoke-command: docker run --rm "$IMAGE" --version | grep -q '0.39.10'

  sonar:
    name: Quality
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/_sonar-scan.yml
    permissions:
      contents: read
    with:
      project-key: docker-builds:pocketbase
      project-name: pocketbase
      upstream-repo: pocketbase/pocketbase
      upstream-ref: v0.39.10
    secrets: inherit
