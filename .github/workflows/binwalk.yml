# binwalk — firmware and binary analysis toolkit.
# Upstream: https://github.com/ReFirmLabs/binwalk (built from upstream's Dockerfile)
---
name: binwalk

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/binwalk.yml
      - .github/workflows/_build-image.yml
  pull_request:
    paths:
      - .github/workflows/binwalk.yml
      - .github/workflows/_build-image.yml
  workflow_dispatch:

concurrency:
  group: binwalk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image
    uses: ./.github/workflows/_build-image.yml
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      image: binwalk
      version: v3.1.0
      context: upstream/binwalk
      upstream-repo: ReFirmLabs/binwalk
      description: Firmware and binary analysis toolkit
      licenses: MIT
      # Upstream's Dockerfile compiles binwalk with cargo, which is slow on arm64.
      build-timeout-minutes: 120
      push: ${{ github.event_name != 'pull_request' }}
      smoke-command: docker run --rm "$IMAGE" --help | grep -qi 'binwalk'

  sonar:
    name: Quality
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/_sonar-scan.yml
    permissions:
      contents: read
    with:
      project-key: docker-builds:binwalk
      project-name: binwalk
      upstream-repo: ReFirmLabs/binwalk
      upstream-ref: v3.1.0
    secrets: inherit
