# dirsearch — web path and file brute-forcing utility.
# Upstream: https://github.com/maurosoria/dirsearch (built from upstream's Dockerfile)
---
name: dirsearch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dirsearch.yml
      - .github/workflows/_build-image.yml
  pull_request:
    paths:
      - .github/workflows/dirsearch.yml
      - .github/workflows/_build-image.yml
  workflow_dispatch:

concurrency:
  group: dirsearch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image
    uses: ./.github/workflows/_build-image.yml
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      image: dirsearch
      version: v0.4.4
      context: upstream/dirsearch
      upstream-repo: maurosoria/dirsearch
      description: Web path and file brute-forcing utility
      licenses: GPL-2.0-or-later
      push: ${{ github.event_name != 'pull_request' }}
      smoke-command: docker run --rm "$IMAGE" --help | grep -qi 'usage'
