# wafw00f — web application firewall fingerprinting toolkit.
# Upstream: https://github.com/EnableSecurity/wafw00f
---
name: wafw00f

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wafw00f.yml
      - .github/workflows/_build-image.yml
      - files/wafw00f/**
  pull_request:
    paths:
      - .github/workflows/wafw00f.yml
      - .github/workflows/_build-image.yml
      - files/wafw00f/**
  workflow_dispatch:

concurrency:
  group: wafw00f-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image
    uses: ./.github/workflows/_build-image.yml
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      image: wafw00f
      version: v2.4.2
      context: files/wafw00f
      description: Web application firewall fingerprinting toolkit
      licenses: BSD-3-Clause
      push: ${{ github.event_name != 'pull_request' }}
      smoke-command: docker run --rm "$IMAGE" --help | grep -qi 'usage'
