# Caddy — custom build with the Cloudflare DNS module compiled in.
# Upstream: https://github.com/caddyserver/caddy
#
# Published as GitHub Release assets rather than a container image, because the
# artifact people want here is the binary itself.
#
# The release tag is derived from CADDY_VERSION. It used to come from
# GITHUB_REF_NAME, which is the branch name on a branch push — that is how the
# existing release ended up tagged `main`.
---
name: caddy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/caddy.yml
  pull_request:
    paths:
      - .github/workflows/caddy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caddy-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_SLUG: caddy
  CADDY_VERSION: "v2.11.4"
  CADDY_MODULES: github.com/caddy-dns/cloudflare
  XCADDY_VERSION: "v0.4.6"
  GO_VERSION: "1.26.5"

jobs:
  build:
    name: Build ${{ matrix.osarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            osarch: linux-amd64
          - goos: linux
            goarch: arm64
            osarch: linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            osarch: linux-armv7
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: caddy-${{ runner.os }}-go${{ env.GO_VERSION }}-xcaddy${{ env.XCADDY_VERSION }}
          restore-keys: |
            caddy-${{ runner.os }}-go${{ env.GO_VERSION }}-

      - name: Install xcaddy ${{ env.XCADDY_VERSION }}
        run: go install "github.com/caddyserver/xcaddy/cmd/xcaddy@${XCADDY_VERSION}"

      - name: Build ${{ matrix.osarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          OSARCH: ${{ matrix.osarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          binary="${APP_SLUG}-${OSARCH}-${CADDY_VERSION}"

          "$(go env GOPATH)/bin/xcaddy" build "${CADDY_VERSION}" \
            --output "dist/${binary}" \
            --with "${CADDY_MODULES}"

          chmod +x "dist/${binary}"
          cd dist
          sha256sum "${binary}" > "${binary}.sha256"
          tar -czf "${binary}.tar.gz" "${binary}"
          rm -f "${binary}"
          ls -lh

      - name: Upload ${{ matrix.osarch }}
        uses: actions/upload-artifact@v7
        with:
          name: caddy-${{ matrix.osarch }}
          path: dist/${{ env.APP_SLUG }}-${{ matrix.osarch }}-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: caddy-linux-*
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 > SHA256SUMS
          {
            echo "### Caddy ${CADDY_VERSION} artifacts"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.APP_SLUG }}-${{ env.CADDY_VERSION }}
          name: Caddy ${{ env.CADDY_VERSION }}
          body: |
            Custom Caddy ${{ env.CADDY_VERSION }} build with `${{ env.CADDY_MODULES }}` compiled in.

            Built with Go ${{ env.GO_VERSION }} and xcaddy ${{ env.XCADDY_VERSION }}.

            Verify a download against `SHA256SUMS`:

            ```bash
            sha256sum -c SHA256SUMS --ignore-missing
            ```
          draft: false
          prerelease: false
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
