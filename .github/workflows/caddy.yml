# Caddy — custom build with the Cloudflare DNS module compiled in.
# Upstream: https://github.com/caddyserver/caddy
#
# Published two ways from the same pins:
#   * binaries as GitHub Release assets (build/release jobs below), including
#     linux-armv7, which the image pipeline has no native runner for;
#   * a multi-arch image, ghcr.io/<owner>/caddy, through the shared
#     _build-image.yml pipeline (image job), built from files/caddy.
#
# A reusable-workflow call cannot read `env`, so the image job repeats the
# version literally; scripts/catalog.py fails CI if it drifts from CADDY_VERSION.
#
# The release tag is derived from CADDY_VERSION. It used to come from
# GITHUB_REF_NAME, which is the branch name on a branch push — that is how the
# existing release ended up tagged `main`.
---
name: caddy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/caddy.yml
      - .github/workflows/_build-image.yml
      - files/caddy/**
  pull_request:
    paths:
      - .github/workflows/caddy.yml
      - .github/workflows/_build-image.yml
      - files/caddy/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caddy-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_SLUG: caddy
  CADDY_VERSION: "v2.11.7"
  CADDY_MODULES: github.com/caddy-dns/cloudflare
  XCADDY_VERSION: "v0.4.7"
  GO_VERSION: "1.27.3"

jobs:
  image:
    name: Image
    uses: ./.github/workflows/_build-image.yml
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      image: caddy
      version: v2.11.7
      context: files/caddy
      description: Caddy web server with the Cloudflare DNS module
      licenses: Apache-2.0
      push: ${{ github.event_name != 'pull_request' }}
      # Check the version and module, then serve a request as the non-root user
      # on :80, which only works if the cap_net_bind_service file capability held.
      smoke-command: |
        set -euo pipefail
        version=$(docker run --rm "$IMAGE" caddy version)
        grep -qE '^v2\.11\.7( |$)' <<<"$version"
        modules=$(docker run --rm "$IMAGE" caddy list-modules)
        grep -qx 'dns.providers.cloudflare' <<<"$modules"
        cid=$(docker run -d "$IMAGE")
        trap 'docker rm -f "$cid" >/dev/null' EXIT
        for _ in $(seq 10); do
          body=$(docker exec "$cid" wget -qO- http://127.0.0.1/ 2>/dev/null || true)
          if [ "$body" = 'Caddy is running' ]; then
            exit 0
          fi
          sleep 1
        done
        docker logs "$cid"
        exit 1

  build:
    name: Build ${{ matrix.osarch }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            osarch: linux-amd64
          - goos: linux
            goarch: arm64
            osarch: linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            osarch: linux-armv7
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: caddy-${{ runner.os }}-go${{ env.GO_VERSION }}-xcaddy${{ env.XCADDY_VERSION }}
          restore-keys: |
            caddy-${{ runner.os }}-go${{ env.GO_VERSION }}-

      - name: Install xcaddy ${{ env.XCADDY_VERSION }}
        run: go install "github.com/caddyserver/xcaddy/cmd/xcaddy@${XCADDY_VERSION}"

      - name: Build ${{ matrix.osarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          OSARCH: ${{ matrix.osarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          binary="${APP_SLUG}-${OSARCH}-${CADDY_VERSION}"

          "$(go env GOPATH)/bin/xcaddy" build "${CADDY_VERSION}" \
            --output "dist/${binary}" \
            --with "${CADDY_MODULES}"

          chmod +x "dist/${binary}"
          cd dist
          sha256sum "${binary}" > "${binary}.sha256"
          tar -czf "${binary}.tar.gz" "${binary}"
          rm -f "${binary}"
          ls -lh

      - name: Upload ${{ matrix.osarch }}
        uses: actions/upload-artifact@v7
        with:
          name: caddy-${{ matrix.osarch }}
          path: dist/${{ env.APP_SLUG }}-${{ matrix.osarch }}-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: caddy-linux-*
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 > SHA256SUMS
          {
            echo "### Caddy ${CADDY_VERSION} artifacts"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.APP_SLUG }}-${{ env.CADDY_VERSION }}
          name: Caddy ${{ env.CADDY_VERSION }}
          body: |
            Custom Caddy ${{ env.CADDY_VERSION }} build with `${{ env.CADDY_MODULES }}` compiled in.

            Built with Go ${{ env.GO_VERSION }} and xcaddy ${{ env.XCADDY_VERSION }}.

            Verify a download against `SHA256SUMS`:

            ```bash
            sha256sum -c SHA256SUMS --ignore-missing
            ```
          draft: false
          prerelease: false
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
