# Metasploit Framework — penetration testing framework.
# Upstream: https://github.com/rapid7/metasploit-framework (built from upstream's Dockerfile)
---
name: metasploit-framework

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/metasploit-framework.yml
      - .github/workflows/_build-image.yml
  pull_request:
    paths:
      - .github/workflows/metasploit-framework.yml
      - .github/workflows/_build-image.yml
  workflow_dispatch:

concurrency:
  group: metasploit-framework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image
    uses: ./.github/workflows/_build-image.yml
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      image: metasploit-framework
      version: "6.5.0"
      context: upstream/metasploit-framework
      upstream-repo: rapid7/metasploit-framework
      description: Metasploit Framework — penetration testing framework
      licenses: BSD-3-Clause
      # Native gem compilation across two architectures is the slowest build here.
      build-timeout-minutes: 150
      push: ${{ github.event_name != 'pull_request' }}
      # Upstream's entrypoint provisions a matching host user and expects a
      # database, so the smoke test bypasses it and checks the payload instead.
      smoke-command: >-
        docker run --rm --entrypoint sh "$IMAGE"
        -c 'ruby --version && test -f ./msfconsole && test -f ./msfvenom'

  sonar:
    name: Quality
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/_sonar-scan.yml
    permissions:
      contents: read
    with:
      project-key: docker-builds:metasploit-framework
      project-name: metasploit-framework
      upstream-repo: rapid7/metasploit-framework
      upstream-ref: "6.5.0"
      extra-args: >-
        -Dsonar.languages=ruby
        -Dsonar.exclusions=**/*.java,**/*.c,**/*.cpp,**/*.h,**/*.mm,**/*.m
        -Dsonar.c.file.suffixes=-
        -Dsonar.cpp.file.suffixes=-
        -Dsonar.objc.file.suffixes=-
    secrets: inherit
