# Dependabot keeps two things current: the actions our workflows call, and the
# base images our Dockerfiles build on.
#
# Base images are pinned literally (for example `FROM python:3.14.6-alpine3.24`)
# rather than assembled from ARGs, because Dependabot cannot resolve ARG
# interpolation in a FROM line and silently skips such Dockerfiles.
---
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /files/*
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: scope
